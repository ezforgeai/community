title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describing the problem you want solved helps us more than a specific solution.

        Upvote existing requests instead of opening duplicates. **Never paste** API keys, tokens, or personal data in this public forum.

        Replies may come from Ember, ezForge's AI assistant. Our team reviews every request.
        **Security issue?** Email `security@ezforge.ai` instead of posting here.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which part of ezForge does this relate to?
      options:
        - ezForge Ready
        - ezForge Hub
        - ezForge Platform (dashboard / account)
        - MCP server / API
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need or frustration, not the solution.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today instead, if anything?
  - type: dropdown
    id: impact
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important (meaningful time or effort saved)
        - Blocking (I can't use ezForge for my use case without it)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, or links to similar features elsewhere.
  - type: checkboxes
    id: search
    attributes:
      label: Duplicate check
      options:
        - label: I searched existing discussions and this has not been requested.
          required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, passwords, and personal data from this post.
          required: true
