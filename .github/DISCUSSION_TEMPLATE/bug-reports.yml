title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Clear steps to reproduce help us fix it faster.

        **Security issue?** Do not post it here. Email `security@ezforge.ai` instead.
        **Never paste** API keys, tokens, passwords, or personal or customer data in this public forum.

        Replies may come from Ember, ezForge's AI assistant. Our team reviews anything Ember cannot resolve.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which part of ezForge is affected?
      options:
        - ezForge Ready
        - ezForge Hub
        - ezForge Platform (dashboard / account)
        - MCP server / API
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Product, app, or MCP client version, if known.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: A short description of the bug and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: AI agent or client (if relevant)
      multiple: true
      options:
        - Claude
        - ChatGPT
        - Gemini
        - Browser (web dashboard)
        - Other
        - Not applicable
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, or MCP client version.
      placeholder: "e.g. Chrome 131 on macOS 15, Claude Desktop 1.2"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste relevant output. Remove any keys, tokens, or personal data first.
      render: text
  - type: checkboxes
    id: search
    attributes:
      label: Duplicate check
      options:
        - label: I searched existing discussions and this bug has not been reported.
          required: true
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, passwords, and personal data from this post.
          required: true
